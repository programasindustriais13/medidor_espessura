<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medidor de Espessura{% endblock %}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/style_inputs.css' %}">
</head>

<body>
    <div class="app-container">
        <header class="top-nav">
            <div class="logo">
                <span class="icon">⚡</span>
                <h1>Medidor de <span class="highlight">Espessura</span></h1>
            </div>
            <nav>
                <a href="{% url 'dashboard' %}" class="active">Dashboard</a>
                <a href="{% url 'admin:index' %}">Admin</a>
            </nav>
        </header>

        <main class="content-wrapper">
            {% block content %}{% endblock %}
        </main>

        <footer class="main-footer">
            <p>&copy; {% now "Y" %} Sistema de Monitoramento Industrial</p>
        </footer>
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
